<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #212121;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2c2c2c;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
        }
        button {
            background: #673ab7;
            color: white;
            border: none;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .secret-info {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 2px dashed #673ab7;
            border-radius: 15px;
            font-size: 24px;
        }
        .spy { color: #ff5252; }
        .location { color: #4caf50; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">🕵️ Spy Game</h1>
        <p id="desc">Нажми кнопку, чтобы узнать свою роль</p>
        
        <button id="mainBtn" onclick="revealRole()">УЗНАТЬ РОЛЬ</button>

        <div id="secretBox" class="secret-info">
            </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function revealRole() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role'); // Получаем роль из ссылки
            const loc = urlParams.get('loc');   // Получаем локацию из ссылки

            const btn = document.getElementById('mainBtn');
            const box = document.getElementById('secretBox');
            const title = document.getElementById('title');
            const desc = document.getElementById('desc');

            btn.style.display = 'none';
            desc.style.display = 'none';
            box.style.display = 'block';

            if (role === 'spy') {
                box.innerHTML = '<span class="spy">🕵️ ТЫ ШПИОН!</span><br><small>Твоя задача — не выдать себя</small>';
            } else {
                box.innerHTML = '📍 Локация:<br><span class="location">' + (loc || 'Неизвестно') + '</span>';
            }
        }
    </script>
</body>
</html>
