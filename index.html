<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spy Game Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121214;
            --card-bg: #1e1e24;
            --accent: #6b48ff;
            --text: #ffffff;
            --spy-color: #ff4757;
            --loc-color: #2ed573;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .screen {
            display: none;
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { margin-top: 0; font-size: 24px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        select, input {
            background: #2a2a32; color: white; border: 1px solid #3a3a42;
            padding: 10px; border-radius: 10px; font-size: 16px; width: 120px;
        }
        button {
            background: var(--accent); color: white; border: none;
            padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold;
            width: 100%; cursor: pointer; margin-top: 20px; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        /* Карточка роли */
        .role-card {
            background: #2a2a32; height: 300px; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 20px; cursor: pointer;
            border: 2px dashed #4a4a52;
        }
        .role-card.revealed { border: 2px solid var(--accent); background: #1e1e24; }
        
        #timerDisplay { font-size: 48px; font-weight: bold; margin: 20px 0; color: var(--loc-color); }
    </style>
</head>
<body>

    <div id="screen-setup" class="screen active">
        <h1>🕵️ Настройки игры</h1>
        <div class="setting-row">
            <span>Кол-во игроков:</span>
            <input type="number" id="playerCount" value="3" min="3" max="15">
        </div>
        <div class="setting-row">
            <span>Кол-во шпионов:</span>
            <input type="number" id="spyCount" value="1" min="1" max="5">
        </div>
        <div class="setting-row">
            <span>Категория:</span>
            <select id="categorySelect">
                <option value="world">🌍 Путешествия</option>
                <option value="fiction">🏰 Вымышленные миры</option>
                <option value="prof">🏢 Места работы</option>
            </select>
        </div>
        <button onclick="startGame()">СОЗДАТЬ ИГРУ</button>
    </div>

    <div id="screen-role" class="screen">
        <h2 id="playerTurnText">Игрок 1</h2>
        <p>Нажми на карточку, чтобы узнать роль. Никому не показывай!</p>
        
        <div class="role-card" id="card" onclick="flipCard()">
            <span id="cardContent">👁️ ПОСМОТРЕТЬ</span>
        </div>
        
        <button id="nextBtn" style="display:none;" onclick="nextPlayer()">ПОНЯТНО, ПЕРЕДАТЬ ДАЛЬШЕ</button>
    </div>

    <div id="screen-timer" class="screen">
        <h1>⏳ Обсуждение</h1>
        <div id="timerDisplay">05:00</div>
        <button onclick="toggleTimer()" id="timerBtn">ПАУЗА</button>
        <button onclick="window.Telegram.WebApp.close()" style="background:#444;">ЗАВЕРШИТЬ ИГРУ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const CATEGORIES = {
            "world": ["Египет", "Париж", "Токио", "Нью-Йорк", "Стамбул", "Лондон"],
            "fiction": ["Хогвартс", "Мордор", "Нарния", "Матрица", "Готэм", "Атлантида"],
            "prof": ["Больница", "Полицейский участок", "Школа", "Ресторан", "Пожарная часть"]
        };

        let roles = [];
        let currentPlayerIndex = 0;
        let cardRevealed = false;
        
        // Таймер
        let timeLeft = 300; // 5 минут
        let timerInterval = null;
        let isTimerRunning = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            const players = parseInt(document.getElementById('playerCount').value);
            const spies = parseInt(document.getElementById('spyCount').value);
            const cat = document.getElementById('categorySelect').value;

            if (spies >= players) {
                tg.showAlert("Шпионов не может быть больше или равно мирным!");
                return;
            }

            // Генерируем локацию
            const locList = CATEGORIES[cat];
            const location = locList[Math.floor(Math.random() * locList.length)];

            // Создаем массив ролей
            roles = Array(players).fill(location);
            for (let i = 0; i < spies; i++) roles[i] = "ШПИОН";
            
            // Перемешиваем
            roles.sort(() => Math.random() - 0.5);

            currentPlayerIndex = 0;
            updateRoleScreen();
            showScreen('screen-role');
        }

        function updateRoleScreen() {
            document.getElementById('playerTurnText').innerText = `Игрок ${currentPlayerIndex + 1} из ${roles.length}`;
            cardRevealed = false;
            const card = document.getElementById('card');
            card.classList.remove('revealed');
            document.getElementById('cardContent').innerHTML = "👁️ НАЖМИ, ЧТОБЫ УЗНАТЬ РОЛЬ";
            document.getElementById('cardContent').style.color = "var(--text)";
            document.getElementById('nextBtn').style.display = "none";
        }

        function flipCard() {
            if (cardRevealed) return;
            cardRevealed = true;
            const role = roles[currentPlayerIndex];
            const card = document.getElementById('card');
            const content = document.getElementById('cardContent');
            
            card.classList.add('revealed');
            
            if (role === "ШПИОН") {
                content.innerHTML = `<span style="color:var(--spy-color); font-size:32px;">🕵️ ТЫ ШПИОН!</span>`;
            } else {
                content.innerHTML = `📍 Локация:<br><span style="color:var(--loc-color); font-size:28px;">${role}</span>`;
            }
            
            document.getElementById('nextBtn').style.display = "block";
            tg.HapticFeedback.impactOccurred('heavy'); // Вибрация
        }

        function nextPlayer() {
            currentPlayerIndex++;
            if (currentPlayerIndex < roles.length) {
                updateRoleScreen();
            } else {
                showScreen('screen-timer');
                startTimer();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    tg.showAlert("⏰ Время вышло! Пора голосовать.");
                    return;
                }
                timeLeft--;
                updateTimerDisplay();
            }, 1000);
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                btn.innerText = "ПРОДОЛЖИТЬ";
                isTimerRunning = false;
            } else {
                startTimer();
                btn.innerText = "ПАУЗА";
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }
    </script>
</body>
</html>
