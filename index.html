<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Game Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            width: 80%;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:active { transform: scale(0.95); }
        .role-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 2px dashed #555;
            border-radius: 10px;
        }
        .spy-text { color: #ff4757; font-size: 24px; }
        .loc-text { color: #2ed573; font-size: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🕵️ SPY GAME</h1>
        <div id="setup">
            <p>Нажми кнопку, чтобы узнать свою роль в этом раунде</p>
            <button onclick="getRole()">УЗНАТЬ РОЛЬ</button>
        </div>

        <div id="result" class="role-box">
            <p>Твоя роль:</p>
            <div id="roleContent"></div>
            <br>
            <button onclick="window.Telegram.WebApp.close()">ПОНЯТНО</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Список локаций (можешь менять прямо тут)
        const locations = ["Заброшенный цирк", "База на Марсе", "Секретная кухня", "Бункер"];

        function getRole() {
            document.getElementById('setup').style.display = 'none';
            const resBox = document.getElementById('result');
            const content = document.getElementById('roleContent');
            resBox.style.display = 'block';

            // Логика: шанс 1 к 3, что ты шпион (для теста)
            if (Math.random() < 0.3) {
                content.innerHTML = '<span class="spy-text">🕵️ ТЫ ШПИОН!</span><p>Твоя цель: не выдать себя.</p>';
            } else {
                const loc = locations[Math.floor(Math.random() * locations.length)];
                content.innerHTML = '<span class="loc-text">📍 ' + loc + '</span><p>Найди шпиона!</p>';
            }
        }
    </script>
</body>
</html>
