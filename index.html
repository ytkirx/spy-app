<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spy Game Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121214; --card: #1e1e24; --accent: #6b48ff; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .screen { display: none; width: 90%; background: var(--card); padding: 30px 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .active { display: block; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px; }
        input, select { background: #2a2a32; color: white; border: 1px solid #444; padding: 8px; border-radius: 10px; width: 100px; }
        button { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 15px; font-size: 18px; font-weight: bold; width: 100%; margin-top: 20px; }
        .role-card { background: #2a2a32; height: 250px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px dashed #555; margin: 20px 0; }
        #timer { font-size: 50px; color: #2ed573; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="setup" class="screen active">
        <h1>🕵️ Настройка игры</h1>
        <div class="row"><span>Игроки:</span><input type="number" id="pCount" value="3"></div>
        <div class="row"><span>Шпионы:</span><input type="number" id="sCount" value="1"></div>
        <div class="row"><span>Тема:</span>
            <select id="cat">
                <option value="travel">🌍 Путешествия</option>
                <option value="work">🏢 Работа</option>
                <option value="fun">🎉 Развлечения</option>
            </select>
        </div>
        <button onclick="initGame()">ПОЕХАЛИ!</button>
    </div>

    <div id="roles" class="screen">
        <h2 id="pNum">Игрок 1</h2>
        <div class="role-card" id="mainCard" onclick="showRole()">ЖМИ, ЧТОБЫ УЗНАТЬ</div>
        <button id="nextBtn" style="display:none;" onclick="nextP()">СЛЕДУЮЩИЙ</button>
    </div>

    <div id="game" class="screen">
        <h1>⌛ Время пошло!</h1>
        <div id="timer">05:00</div>
        <button onclick="location.reload()">ЗАКОНЧИТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const DATA = {
            travel: ["Париж", "Дубай", "Токио", "Нью-Йорк", "Египет"],
            work: ["Больница", "Офис Google", "Завод", "Школа", "Стройка"],
            fun: ["Цирк", "Аквапарк", "Кинотеатр", "Ночной клуб", "Зоопарк"]
        };
        let gameRoles = [], curr = 0, isRevealed = false;

        function initGame() {
            let p = parseInt(document.getElementById('pCount').value);
            let s = parseInt(document.getElementById('sCount').value);
            let cat = document.getElementById('cat').value;
            let loc = DATA[cat][Math.floor(Math.random()*DATA[cat].length)];
            
            gameRoles = Array(p).fill(loc);
            for(let i=0; i<s; i++) gameRoles[i] = "ШПИОН 🕵️";
            gameRoles.sort(() => Math.random() - 0.5);

            document.getElementById('setup').classList.remove('active');
            document.getElementById('roles').classList.add('active');
        }

        function showRole() {
            if(isRevealed) return;
            const card = document.getElementById('mainCard');
            card.innerText = gameRoles[curr];
            card.style.border = "2px solid #6b48ff";
            document.getElementById('nextBtn').style.display = "block";
            isRevealed = true;
            tg.HapticFeedback.impactOccurred('medium');
        }

        function nextP() {
            curr++;
            if(curr < gameRoles.length) {
                isRevealed = false;
                document.getElementById('pNum').innerText = "Игрок " + (curr + 1);
                document.getElementById('mainCard').innerText = "ЖМИ, ЧТОБЫ УЗНАТЬ";
                document.getElementById('mainCard').style.border = "2px dashed #555";
                document.getElementById('nextBtn').style.display = "none";
            } else {
                document.getElementById('roles').classList.remove('active');
                document.getElementById('game').classList.add('active');
                startTimer();
            }
        }

        function startTimer() {
            let time = 300;
            setInterval(() => {
                if(time <= 0) return;
                time--;
                let m = Math.floor(time/60), s = time%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
            }, 1000);
        }
    </script>
</body>
</html>
